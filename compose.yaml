name: precool-energy-operations

services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      additional_contexts:
        reporting: ${REPORTING_BUILD_CONTEXT:-../reporting}
    environment:
      DORIS_API_HOST: 0.0.0.0
      DORIS_API_PORT: 8788
      DB_HOST: ${DB_HOST:?Set DB_HOST in the Compose env file}
      DB_PORT: ${DB_PORT:-9030}
      DB_USER: ${DB_USER:?Set DB_USER in the Compose env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Compose env file}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in the Compose env file}
      REPORTING_ROOT: /opt/reporting
      REPORTING_PYTHON: /usr/local/bin/python
      REPORTING_WORKER_SRC: /opt/reporting/services/worker-py/src
    ports:
      - "127.0.0.1:${DORIS_API_PORT:-8788}:8788"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      DORIS_API_BASE_URL: http://api:8788
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5173}:5173"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(function (response) { process.exit(response.ok ? 0 : 1) }).catch(function () { process.exit(1) })"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
